name: Company Scrapper scan

# Runs the scanner in bounded windows instead of as one eternal process —
# a GitHub Actions job hard-caps at 6 hours, so this is the "GitHub
# Actions" deployment target scan_worker.py's MAX_RUNTIME_SECONDS was
# built for: run for ~5.5h, exit clean, let the next scheduled trigger
# pick back up. Nothing is lost between runs — progress lives in each
# shard database's own scan_tiles table, not in this job's own disk,
# which gets thrown away the moment it ends either way.
#
# SHARDING: moved off Prisma Postgres to TiDB Cloud Starter — Prisma's
# 2GB/workspace free-tier cap was already being exceeded by the live data,
# and scaling it further meant more separate email sign-ups, which ran
# out. TiDB Cloud Starter gives up to 5 free instances PER ACCOUNT (no
# card needed), 5GiB storage + 50M request units/month each. The work is
# split across as many free TiDB instances as you add here as
# DATABASE_URL_1, DATABASE_URL_2, DATABASE_URL_3, ... secrets —
# scan_worker.py discovers whichever numbered ones exist and scans all of
# them AT THE SAME TIME (one thread per shard). Add every DATABASE_URL_N
# secret you want BELOW in the env block (GitHub Actions doesn't support
# wildcard secret passthrough, so each numbered one needs its own line
# here) before the shard count you want is live, and apply
# database/schema.mysql.sql to each new shard database by hand before
# wiring up its secret, same one-time manual step as before. Leave the
# shard count alone until a full pass finishes — see scan_worker.py's
# module docstring for why.
#
# This repo is public, so these minutes are free and unlimited — no
# billing setup needed anywhere for this, which is the whole reason this
# replaced the Oracle VM plan.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # lets you trigger a run by hand from the Actions tab

concurrency:
  group: company-scrapper-scan
  cancel-in-progress: false   # never kill a run mid-tile; if the next schedule
                                # fires while one's still going, it just waits

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # hard safety net just under GitHub's 360-minute cap,
                                 # above MAX_RUNTIME_SECONDS below so the script's own
                                 # clean exit fires first in the normal case
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scanner-service
        run: pip install -r requirements.txt

      - name: Run scan (bounded to ~5.5h, exits clean either way)
        working-directory: scanner-service
        env:
          # Add one line per shard you've created — scan_worker.py picks
          # up however many of these actually resolve to a non-empty
          # value and ignores the rest (a secret that was never added in
          # the repo's Settings -> Secrets just renders as empty here).
          DATABASE_URL_1: ${{ secrets.DATABASE_URL_1 }}
          DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 }}
          DATABASE_URL_3: ${{ secrets.DATABASE_URL_3 }}
          DATABASE_URL_4: ${{ secrets.DATABASE_URL_4 }}
          DATABASE_URL_5: ${{ secrets.DATABASE_URL_5 }}
          MAX_RUNTIME_SECONDS: "19800"
          TILE_DEG: "5"
          DUCKDB_THREADS: "2"
          # Runs concurrently per shard now, so this is PER SHARD THREAD —
          # total memory use is roughly (number of shards) x this value.
          # ubuntu-latest gives ~16GB/4 cores: 1024MB is safe up to ~10
          # shards at once; raise it back up if you're only running 1-2.
          DUCKDB_MEMORY_LIMIT: "1024MB"
        run: python scan_worker.py
