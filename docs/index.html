<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company Scrapper — Live</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --panel: #121318;
    --panel-2: #181a21;
    --border: #262833;
    --text: #e8e9ed;
    --text-dim: #8b8d98;
    --text-dimmer: #5c5e6b;
    --accent: #6c6cf5;
    --accent-dim: #3a3a8c;
    --accent-bg: rgba(108, 108, 245, 0.12);
    --danger: #ff6b6b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    line-height: 1.5; font-size: 14px;
  }
  a { color: var(--accent); }
  button { font-family: inherit; cursor: pointer; }
  input[type=text], input[type=search] {
    font-family: inherit; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 0.85rem;
  }
  input[type=text]:focus, input[type=search]:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

  .page-head { padding: 20px 24px 0; }
  .page-head h1 { font-size: 1.3rem; margin: 0 0 2px; }
  .page-head .sub { color: var(--text-dim); margin: 0; font-size: 0.85rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px; margin: 16px 24px; }
  .stat { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius);
          padding: 12px 14px; }
  .stat .n { font-size: 1.4rem; font-weight: 700; display: block; }
  .stat .l { font-size: 0.75rem; color: var(--text-dim); }

  /* ===================================================================
     Find Companies — Apollo-style filter sidebar + paginated result
     table. This is the ONLY way to find companies: every filter value
     comes from GET /api/filters (real, live database values — never a
     hardcoded guess), and the result table is GET /api/companies, a
     real paginated+filtered query, 30 real rows per page. There is
     deliberately no free-text/chat search anywhere on this page.
     =================================================================== */
  .finder { display: flex; align-items: flex-start; gap: 0; margin: 10px 24px 24px;
            border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
            background: var(--panel); min-height: 74vh; }

  .finder-sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border);
                     max-height: 82vh; overflow-y: auto; }
  .finder-sidebar-head { display: flex; align-items: center; justify-content: space-between;
                          padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .finder-sidebar-head strong { font-size: 0.85rem; }
  .clear-link { background: none; border: none; color: var(--accent); font-size: 0.78rem; padding: 0; }
  .clear-link:disabled { color: var(--text-dimmer); cursor: default; }

  .filter-group { border-bottom: 1px solid var(--border); }
  .filter-group-head { display: flex; align-items: center; justify-content: space-between;
                        padding: 11px 14px; background: none; border: none; width: 100%;
                        color: var(--text); font-size: 0.82rem; font-weight: 600; text-align: left; }
  .filter-group-head .count-pill { font-weight: 400; color: var(--text-dim); font-size: 0.72rem;
                        background: var(--panel-2); border-radius: 20px; padding: 1px 7px; margin-left: 6px; }
  .filter-group-head .chev { transition: transform 0.15s; color: var(--text-dim); font-size: 0.7rem; }
  .filter-group.collapsed .chev { transform: rotate(-90deg); }
  .filter-group-body { padding: 0 14px 12px; }
  .filter-group.collapsed .filter-group-body { display: none; }
  .filter-search { width: 100%; margin-bottom: 8px; }
  .filter-list { max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .filter-option { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-radius: 5px;
                    font-size: 0.82rem; cursor: pointer; }
  .filter-option:hover { background: var(--panel-2); }
  .filter-option label { cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis;
                          white-space: nowrap; }
  .filter-empty-note { color: var(--text-dimmer); font-size: 0.78rem; padding: 4px 2px; }

  .finder-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .finder-top { display: flex; align-items: center; justify-content: space-between;
                padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .finder-total { font-size: 0.9rem; }
  .finder-total strong { font-weight: 700; }
  .finder-top .active-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-bg);
          color: var(--accent); border-radius: 20px; padding: 3px 9px 3px 10px; font-size: 0.75rem; }
  .chip .x { cursor: pointer; opacity: 0.8; }
  .chip .x:hover { opacity: 1; }

  .table-wrap { flex: 1; overflow: auto; }
  table.companies { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.companies th { position: sticky; top: 0; background: var(--panel); text-align: left;
                        padding: 9px 14px; color: var(--text-dim); font-weight: 600;
                        font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
                        border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.companies td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.companies tr:hover td { background: var(--panel-2); }
  .co-name { font-weight: 600; }
  .co-sub { color: var(--text-dim); font-size: 0.76rem; }
  .status-pill { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 0.72rem;
                 background: var(--panel-2); color: var(--text-dim); }
  .status-pill.open { color: #4ade80; }
  .status-pill.closed { color: var(--danger); }
  .no-site { color: var(--text-dimmer); font-style: italic; }
  .finder-empty, .finder-loading { margin: auto; padding: 60px 20px; text-align: center;
                      color: var(--text-dim); font-size: 0.9rem; }

  .finder-pagination { display: flex; align-items: center; justify-content: space-between;
                        padding: 10px 18px; border-top: 1px solid var(--border); font-size: 0.82rem; }
  .finder-pagination button { background: var(--panel-2); border: 1px solid var(--border);
                        color: var(--text); border-radius: 7px; padding: 6px 12px; font-size: 0.8rem; }
  .finder-pagination button:disabled { opacity: 0.4; cursor: default; }
  .finder-pagination button:not(:disabled):hover { border-color: var(--accent); }

  @media (max-width: 760px) {
    .finder { flex-direction: column; }
    .finder-sidebar { width: 100%; max-height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
  <div class="page-head">
    <h1>Company Scrapper</h1>
    <p class="sub">Live view of the Researchers category's always-on business discovery AI.</p>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><span class="n">—</span><span class="l">businesses tracked</span></div>
    <div class="stat"><span class="n">—</span><span class="l">no website</span></div>
    <div class="stat"><span class="n">—</span><span class="l">categories</span></div>
    <div class="stat"><span class="n">—</span><span class="l">last updated</span></div>
  </div>

  <div class="finder">
    <div class="finder-sidebar" id="finder-sidebar">
      <div class="finder-sidebar-head">
        <strong>Filters</strong>
        <button class="clear-link" id="clear-filters-btn" disabled>Clear all</button>
      </div>
      <div id="filter-groups-dynamic"><div class="finder-loading">Loading filters…</div></div>
      <div id="filter-groups-static"></div>
    </div>
    <div class="finder-main">
      <div class="finder-top">
        <div class="finder-total" id="finder-total">Loading…</div>
        <div class="active-chips" id="active-chips"></div>
      </div>
      <div class="table-wrap" id="table-wrap">
        <div class="finder-loading">Loading companies…</div>
      </div>
      <div class="finder-pagination" id="finder-pagination" style="display:none;">
        <button id="pg-prev">‹ Prev</button>
        <span id="pg-label"></span>
        <button id="pg-next">Next ›</button>
      </div>
    </div>
  </div>

  <script>
    // Update this if the Render service's URL ever changes.
    const API_BASE = "https://aicompany-tmg7.onrender.com";

    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const s = await res.json();
        const cards = document.querySelectorAll("#stats .stat");
        cards[0].querySelector(".n").textContent = (s.total_businesses ?? 0).toLocaleString();
        cards[1].querySelector(".n").textContent = (s.no_website_count ?? 0).toLocaleString();
        cards[2].querySelector(".n").textContent = (s.distinct_categories ?? 0).toLocaleString();
        cards[3].querySelector(".n").textContent = s.last_updated
          ? new Date(s.last_updated).toLocaleString() : "—";
      } catch (e) { /* stats are a nice-to-have header — a failure here shouldn't block the rest of the page */ }
    }

    // =====================================================================
    // Find Companies — Apollo-style filter sidebar + paginated table.
    // Every filter VALUE shown (categories/countries/regions/statuses)
    // comes straight from GET /api/filters — real distinct values live in
    // the database right now, never a hand-maintained guess list. Picking
    // filters re-queries GET /api/companies, a real filtered+paginated
    // search (30 real rows/page) — nothing here is estimated or faked.
    // =====================================================================
    const finderState = {
      options: null,                 // { categories, countries, regions: {country: [..]}, statuses }
      selected: { categories: new Set(), countries: new Set(), regions: new Set(), statuses: new Set() },
      noWebsiteOnly: false,
      city: "",
      page: 1,
      searchTerms: {},                // per-group live filter-the-checkbox-list text
      collapsed: {},                  // per-group collapsed state
    };

    const FILTER_GROUPS = [
      { key: "categories", label: "Category", searchable: true },
      { key: "countries", label: "Country", searchable: false },
      { key: "regions", label: "State / Region", searchable: true },
      { key: "statuses", label: "Status", searchable: false },
    ];

    function optionsFor(groupKey) {
      if (!finderState.options) return [];
      if (groupKey === "regions") {
        // Regions are grouped by country server-side (a region code only
        // means something in context); flattened here into one pickable
        // list since this platform only has US + its own territories today.
        const out = [];
        for (const country of Object.keys(finderState.options.regions || {})) {
          for (const r of finderState.options.regions[country]) out.push(r);
        }
        return [...new Set(out)].sort();
      }
      return finderState.options[groupKey] || [];
    }

    function renderFilterGroups() {
      const container = document.getElementById("filter-groups-dynamic");
      container.innerHTML = "";

      for (const group of FILTER_GROUPS) {
        const all = optionsFor(group.key);
        const wrap = document.createElement("div");
        wrap.className = "filter-group" + (finderState.collapsed[group.key] ? " collapsed" : "");

        const selectedCount = finderState.selected[group.key].size;
        const head = document.createElement("button");
        head.className = "filter-group-head";
        head.innerHTML = `<span>${group.label}${selectedCount ? `<span class="count-pill">${selectedCount}</span>` : ""}</span><span class="chev">▾</span>`;
        head.addEventListener("click", () => {
          finderState.collapsed[group.key] = !finderState.collapsed[group.key];
          renderFilterGroups();
        });
        wrap.appendChild(head);

        const body = document.createElement("div");
        body.className = "filter-group-body";

        if (all.length === 0) {
          body.innerHTML = `<div class="filter-empty-note">No real "${group.label.toLowerCase()}" values in the database yet.</div>`;
        } else {
          if (group.searchable && all.length > 8) {
            const search = document.createElement("input");
            search.type = "search";
            search.className = "filter-search";
            search.placeholder = `Search ${group.label.toLowerCase()}…`;
            search.value = finderState.searchTerms[group.key] || "";
            search.addEventListener("input", () => {
              finderState.searchTerms[group.key] = search.value;
              renderOptionList(group.key, listEl);
            });
            body.appendChild(search);
          }
          const listEl = document.createElement("div");
          listEl.className = "filter-list";
          body.appendChild(listEl);
          renderOptionList(group.key, listEl);
        }

        wrap.appendChild(body);
        container.appendChild(wrap);
      }

      updateClearButton();
    }

    function renderOptionList(groupKey, listEl) {
      const term = (finderState.searchTerms[groupKey] || "").toLowerCase();
      const all = optionsFor(groupKey).filter((v) => !term || v.toLowerCase().includes(term));
      listEl.innerHTML = "";
      for (const value of all) {
        const id = `f-${groupKey}-${value}`;
        const row = document.createElement("div");
        row.className = "filter-option";
        const checked = finderState.selected[groupKey].has(value);
        row.innerHTML = `<input type="checkbox" id="${id}" ${checked ? "checked" : ""}/><label for="${id}">${escapeHtml(value.replace(/_/g, " "))}</label>`;
        row.querySelector("input").addEventListener("change", (e) => {
          if (e.target.checked) finderState.selected[groupKey].add(value);
          else finderState.selected[groupKey].delete(value);
          finderState.page = 1;
          renderFilterGroups();
          renderActiveChips();
          fetchCompanies();
        });
        listEl.appendChild(row);
      }
      if (all.length === 0) {
        listEl.innerHTML = `<div class="filter-empty-note">No matches.</div>`;
      }
    }

    function updateClearButton() {
      const anyActive = Object.values(finderState.selected).some((s) => s.size > 0)
        || finderState.noWebsiteOnly || finderState.city;
      document.getElementById("clear-filters-btn").disabled = !anyActive;
    }

    function renderActiveChips() {
      const box = document.getElementById("active-chips");
      box.innerHTML = "";
      const addChip = (text, onRemove) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = `${escapeHtml(text)}<span class="x">✕</span>`;
        chip.querySelector(".x").addEventListener("click", onRemove);
        box.appendChild(chip);
      };
      for (const group of FILTER_GROUPS) {
        for (const value of finderState.selected[group.key]) {
          addChip(value.replace(/_/g, " "), () => {
            finderState.selected[group.key].delete(value);
            finderState.page = 1;
            renderFilterGroups(); renderActiveChips(); fetchCompanies();
          });
        }
      }
      if (finderState.noWebsiteOnly) {
        addChip("No website", () => {
          finderState.noWebsiteOnly = false;
          document.getElementById("no-website-toggle") && (document.getElementById("no-website-toggle").checked = false);
          finderState.page = 1;
          renderActiveChips(); fetchCompanies();
        });
      }
      if (finderState.city) {
        addChip(`City: ${finderState.city}`, () => {
          finderState.city = "";
          const input = document.getElementById("city-filter-input");
          if (input) input.value = "";
          finderState.page = 1;
          renderActiveChips(); fetchCompanies();
        });
      }
    }

    document.getElementById("clear-filters-btn").addEventListener("click", () => {
      for (const group of FILTER_GROUPS) finderState.selected[group.key].clear();
      finderState.noWebsiteOnly = false;
      finderState.city = "";
      finderState.page = 1;
      const websiteToggle = document.getElementById("no-website-toggle");
      if (websiteToggle) websiteToggle.checked = false;
      const cityInput = document.getElementById("city-filter-input");
      if (cityInput) cityInput.value = "";
      renderFilterGroups();
      renderActiveChips();
      fetchCompanies();
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function statusPillHtml(status) {
      if (!status) return "";
      const cls = /open/i.test(status) ? "open" : /closed/i.test(status) ? "closed" : "";
      return `<span class="status-pill ${cls}">${escapeHtml(status)}</span>`;
    }

    function renderCompanies(data) {
      const wrap = document.getElementById("table-wrap");
      const totalEl = document.getElementById("finder-total");
      const pagEl = document.getElementById("finder-pagination");

      totalEl.innerHTML = `<strong>${data.total.toLocaleString()}</strong> compan${data.total === 1 ? "y" : "ies"} match`;

      if (!data.companies.length) {
        wrap.innerHTML = `<div class="finder-empty">No companies match these filters yet. Try removing one.</div>`;
        pagEl.style.display = "none";
        return;
      }

      let html = `<table class="companies"><thead><tr>
        <th>Name</th><th>Category</th><th>Location</th><th>Website</th><th>Phone</th><th>Status</th>
      </tr></thead><tbody>`;
      for (const c of data.companies) {
        const loc = [c.city, c.region].filter(Boolean).join(", ") || "—";
        const website = c.website
          ? `<a href="${escapeHtml(c.website)}" target="_blank" rel="noopener">${escapeHtml(c.website.replace(/^https?:\/\//, ""))}</a>`
          : `<span class="no-site">no website</span>`;
        html += `<tr>
          <td class="co-name">${escapeHtml(c.name || "(unnamed)")}${c.address ? `<div class="co-sub">${escapeHtml(c.address)}</div>` : ""}</td>
          <td>${escapeHtml((c.category || "").replace(/_/g, " "))}</td>
          <td>${escapeHtml(loc)}</td>
          <td>${website}</td>
          <td>${c.phone ? escapeHtml(c.phone) : "—"}</td>
          <td>${statusPillHtml(c.operating_status)}</td>
        </tr>`;
      }
      html += "</tbody></table>";
      wrap.innerHTML = html;

      const start = (data.page - 1) * data.pageSize + 1;
      const end = Math.min(data.page * data.pageSize, data.total);
      document.getElementById("pg-label").textContent = `${start.toLocaleString()}–${end.toLocaleString()} of ${data.total.toLocaleString()}`;
      document.getElementById("pg-prev").disabled = data.page <= 1;
      document.getElementById("pg-next").disabled = end >= data.total;
      pagEl.style.display = "flex";
    }

    let fetchToken = 0;
    async function fetchCompanies() {
      const token = ++fetchToken;
      const wrap = document.getElementById("table-wrap");
      wrap.innerHTML = `<div class="finder-loading">Loading companies…</div>`;
      updateClearButton();

      const qp = new URLSearchParams();
      for (const group of FILTER_GROUPS) {
        if (finderState.selected[group.key].size) qp.set(group.key, [...finderState.selected[group.key]].join(","));
      }
      if (finderState.noWebsiteOnly) qp.set("no_website_only", "true");
      if (finderState.city) qp.set("city", finderState.city);
      qp.set("page", String(finderState.page));

      try {
        const res = await fetch(`${API_BASE}/api/companies?${qp.toString()}`);
        const data = await res.json();
        if (token !== fetchToken) return; // a newer request has superseded this one
        if (!res.ok || data.error) {
          wrap.innerHTML = `<div class="finder-empty">${escapeHtml(data.error || `Request failed (HTTP ${res.status}).`)}</div>`;
          document.getElementById("finder-pagination").style.display = "none";
          return;
        }
        renderCompanies(data);
      } catch (e) {
        if (token !== fetchToken) return;
        wrap.innerHTML = `<div class="finder-empty">Couldn't reach the live service (${escapeHtml(e.message)}). It may still be waking up — try again shortly.</div>`;
        document.getElementById("finder-pagination").style.display = "none";
      }
    }

    document.getElementById("pg-prev").addEventListener("click", () => {
      if (finderState.page > 1) { finderState.page--; fetchCompanies(); }
    });
    document.getElementById("pg-next").addEventListener("click", () => {
      finderState.page++; fetchCompanies();
    });

    async function initFinder() {
      try {
        const res = await fetch(`${API_BASE}/api/filters`);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        finderState.options = data;
      } catch (e) {
        document.getElementById("filter-groups-dynamic").innerHTML =
          `<div class="finder-empty" style="padding:20px 14px;">Couldn't load filters (${escapeHtml(e.message)}).</div>`;
      }

      // Inject the two non-checkbox filter controls (website presence,
      // city free-text) as their own small groups alongside the checkbox
      // groups above, same collapsible-section look.
      const extra = document.createElement("div");
      extra.className = "filter-group";
      extra.innerHTML = `
        <div class="filter-group-head"><span>Website</span></div>
        <div class="filter-group-body">
          <div class="filter-option">
            <input type="checkbox" id="no-website-toggle"/>
            <label for="no-website-toggle">No website only</label>
          </div>
        </div>`;
      const cityGroup = document.createElement("div");
      cityGroup.className = "filter-group";
      cityGroup.innerHTML = `
        <div class="filter-group-head"><span>City</span></div>
        <div class="filter-group-body">
          <input type="text" id="city-filter-input" class="filter-search" style="margin-bottom:0;" placeholder="e.g. Columbus"/>
        </div>`;

      renderFilterGroups();
      const staticContainer = document.getElementById("filter-groups-static");
      staticContainer.appendChild(extra);
      staticContainer.appendChild(cityGroup);

      document.getElementById("no-website-toggle").addEventListener("change", (e) => {
        finderState.noWebsiteOnly = e.target.checked;
        finderState.page = 1;
        renderActiveChips(); fetchCompanies();
      });
      let cityDebounce;
      document.getElementById("city-filter-input").addEventListener("input", (e) => {
        clearTimeout(cityDebounce);
        cityDebounce = setTimeout(() => {
          finderState.city = e.target.value.trim();
          finderState.page = 1;
          renderActiveChips(); fetchCompanies();
        }, 350);
      });

      fetchCompanies();
    }

    loadStats();
    initFinder();
  </script>
</body>
</html>
