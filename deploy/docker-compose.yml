# Runs on the Oracle Always Free VM. One compose file for every worker AI
# this project builds — "tons and tons more" just means more entries under
# services:, each with its own mem_limit so nothing can starve the others
# on a shared box. docker compose up -d --build (re)builds and (re)starts
# everything; docker compose up -d --build <name> touches just one service.
#
# Real Oracle Always Free ceiling: up to 4 OCPUs / 24GB RAM total on one
# Ampere A1 VM. mem_limit below is a per-service cap, not a request — set
# the VM's actual OCPU/RAM size to match how many of these you're running
# at once, and raise/lower these caps as you add more services.

services:
  company-scrapper-scanner:
    build:
      context: ../scanner-service
    container_name: company-scrapper-scanner
    restart: unless-stopped
    env_file:
      - ./company-scrapper-scanner.env
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Next worker AI goes here as its own service block, e.g.:
