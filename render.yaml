# Render Blueprint — documents the web service's setup. Since
# render-service was already created manually in the Render dashboard
# (not via Blueprint sync), don't run "New -> Blueprint" from this file —
# it may try to stand up a SEPARATE service from the one you already have.
# This file exists as the single source of truth for those env values, not
# as something Render auto-applies here.
#
# The scanner is NOT a Render service anymore — it moved to GitHub Actions
# (.github/workflows/scan.yml), which is free/unlimited on a public repo
# and doesn't hit Render's 512MB worker memory ceiling. If you still have
# a "company-scrapper-scanner" Background Worker running on Render from
# before, delete it — otherwise it's just duplicate work against the same
# database.
services:
  - type: web
    name: company-scrapper-service
    runtime: node
    rootDir: render-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INGEST_SECRET
        sync: false
